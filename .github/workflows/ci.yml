name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint, debug build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Unit tests
        run: ./gradlew test

      # Runs even when tests fail, so one push reports both kinds of problem.
      - name: Android Lint
        if: ${{ !cancelled() }}
        run: ./gradlew lint

      - name: Debug build
        if: ${{ !cancelled() }}
        run: ./gradlew assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7
